<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Khoá zoom mặc định trên mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chuyến Xe Lịch Sử</title>
<style>
    /* CSS CƠ BẢN ĐÃ CHUYỂN SANG ĐƠN VỊ VIEWPORT (VW, VH, VMIN) ĐỂ CHỐNG ZOOM */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #000; overflow: hidden; color: white; }
    
    /* Nút bấm tự động co giãn */
    button { 
        padding: 1.5vh 3vw; 
        font-size: 2.5vmin; 
        cursor: pointer; 
        border: none; 
        border-radius: 1vmin; 
        font-weight: bold; 
        background: #ff4757; 
        color: white; 
        transition: 0.3s; 
        z-index: 50; 
        position: relative;
    }
    button:hover { background: #ff6b81; transform: scale(1.05); }

    /* QUẢN LÝ CÁC MÀN HÌNH (SCENES) */
    .scene { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; flex-direction: column; width: 100vw; height: 100vh; background-size: cover; background-position: center; transition: opacity 1s ease; opacity: 0;}
    .scene.active { display: flex; opacity: 1;}

    /* SCENE 1: INTRO */
    #scene-intro { background-image: url('ki-niem-81-nam.png'); }
    
    /* SCENE 2: HISTORY */
    #scene-history { background-image: url('ki-niem-81-nam.png'); position: relative; }
    #slide-container { 
        position: absolute; 
        right: 8vw; 
        top: 50%; 
        transform: translateY(-50%); 
        width: 45vw; /* Dùng vw để luôn chiếm đúng 45% chiều rộng màn hình dù zoom */
        aspect-ratio: 4 / 3; 
        z-index: 2; 
    }
    #slide-img { width: 100%; height: 100%; object-fit: cover; -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 95%); mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 95%); transition: opacity 0.8s ease-in-out; }
    
    /* Căn giữa nút Tiếp tục */
    #btn-tieptuc { display: none; position: absolute; bottom: 8vh; left: 50%; transform: translateX(-50%); z-index: 10; } 

    /* SCENE 3: LỖI */
    #scene-error { background: #000; padding: 0; }
    #error-img { width: 100vw; height: 100vh; object-fit: cover; }
    
    /* SCENE 4: TROLL MEME */
    #scene-meme { background: #000; text-align: center; }
    #meme-troll-img { width: 35vmin; } /* Ảnh meme tự co giãn */
    #troll-text { font-size: 6vmin; font-weight: bold; margin-top: 3vh; transition: 0.5s; }

    /* SCENE 5: CHÚC MỪNG BẰNG CANVAS */
    #scene-wishes { 
        background-color: #000; 
        background-size: cover; 
        background-position: center; 
        position: relative; 
    }
    #wish-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* STICKER VÀ CHỮ CŨNG DÙNG VMIN CHỐNG ZOOM */
    #sticker-img-left { position: absolute; bottom: 3vh; left: 3vw; width: 20vmin; z-index: 3; }
    #sticker-img-right { position: absolute; bottom: 3vh; right: 3vw; width: 20vmin; z-index: 3; transform: scaleX(-1); } 
    
    #html-wish-text {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 5vmin; /* Chữ tự động to nhỏ theo màn hình */
        font-weight: bold;
        color: #ffebf0;
        text-shadow: 0 0 1.5vmin #e180a3, 0 0 0.5vmin #fff;
        text-align: center;
        width: 80vw;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
    }

    #cake-container { display: none; position: absolute; top: 80%; left: 50%; transform: translate(-50%, -50%); flex-direction: column; align-items: center; z-index: 10; }

    /* SCENE 6: PARTY */
    #scene-party { background: #111; }
    #party-text { z-index: 10; font-size: 6vmin; text-shadow: 0.2vmin 0.2vmin 0.5vmin red; text-align: center;}
    .dancing-meme { position: absolute; width: 15vmin; z-index: 5; }
</style>
</head>
<body>

    <!-- 1. MÀN HÌNH BẮT ĐẦU -->
    <div id="scene-intro" class="scene active"><button id="btn-timhieu">Tìm hiểu</button></div>

    <!-- 2. MÀN HÌNH LỊCH SỬ & NGHE NHẠC -->
    <div id="scene-history" class="scene">
        <div id="slide-container"><img id="slide-img" src="" alt="Ảnh lịch sử"></div>
        <button id="btn-tieptuc">Tiếp tục</button>
    </div>

    <!-- 3. MÀN HÌNH LỖI MÁY TÍNH -->
    <div id="scene-error" class="scene"><img id="error-img" src="anh.jpg" alt="Màn hình lỗi"></div>

    <!-- 4. MÀN HÌNH MEME LỪA ĐẢO -->
    <div id="scene-meme" class="scene">
        <img id="meme-troll-img" src="meme_troll.jpg" alt="Meme">
        <div id="troll-text">Hehe</div>
    </div>

    <!-- 5. MÀN HÌNH LỜI CHÚC & BÁNH SINH NHẬT -->
    <div id="scene-wishes" class="scene">
        <canvas id="wish-canvas"></canvas>
        <img id="sticker-img-left" src="sharkthr.gif" alt="Sticker trái">
        <img id="sticker-img-right" src="sharkthr.gif" alt="Sticker phải">
        
        <div id="html-wish-text"></div>

        <div id="cake-container">
            <button id="btn-thoinen">Thổi nến 🎂</button>
        </div>
    </div>

    <!-- 6. MÀN HÌNH PARTY NẢY MÚA -->
    <div id="scene-party" class="scene">
        <h1 id="party-text">CHÚC MỪNG SINH NHẬT!!! 🎉</h1>
    </div>

<script>
    // ==========================================
    // 1. CẤU HÌNH TÀI NGUYÊN 
    // ==========================================
    const CONFIG = {
        images: {
            slidePhotos: ["cmt8.jpg", "cmt81..jpg", "cmt82.jpg", "cmt83.jpg", "cmt84.jpg"],
            partyGifs: ["dance1.gif", "dance2.gif", "dance3.gif", "dance4.gif"],
            wishBg: "nentraitim.jpg" 
        },
        audio: {
            historyBg: "ShortKit-Call of Silence (full version).mp3",
            history1: "ShortKit-Thư kêu gọi nhân dân cả nước Tổng khởi nghĩa 8 1945 Giờ quyết định cho vận mệnh.mp3",
            history2: "hoidongbaocanuoc.mp3",
            birthdayBg: "ShortKit-Happy Birthday Celebration Piano Music Birthday Party.mp3",
            partyList: ["ShortKit-Mừng sinh nhật cụ Trang kiểu.mp3", "ShortKit-Trả lời @Trang Đô TN chúc Trang sinh nhật vui vẻ nha.mp3", "ShortKit-Trả lời @tetbe9 Một Ngày Chẳng Nắng - Độ Mixi - Ai Cover.mp3"]
        },
        wishes: [
            "Chúc mừng\nsinh nhật!",
            "Tuổi mới\nnhiều niềm vui",
            "Mãi mãi\nhạnh phúc nhé!"
        ]
    };

    document.getElementById('scene-wishes').style.backgroundImage = "url('" + CONFIG.images.wishBg + "')";

    const scenes = document.querySelectorAll('.scene');
    
    let audioHistoryBg = new Audio(CONFIG.audio.historyBg);
    audioHistoryBg.loop = true;
    audioHistoryBg.volume = 0.03;

    let audioH1 = new Audio(CONFIG.audio.history1);
    let audioH2 = new Audio(CONFIG.audio.history2);
    let audioBDay = new Audio(CONFIG.audio.birthdayBg);
    let audioParty = new Audio(CONFIG.audio.partyList[0]);
    let historyH2Timer = null;
    
    function switchScene(sceneId) {
        scenes.forEach(s => s.classList.remove('active'));
        document.getElementById(sceneId).classList.add('active');
    }

    function fadeVolume(audioElement, startVol, endVol, durationMs) {
        const steps = 20;
        const intervalTime = durationMs / steps;
        const volumeStep = (endVol - startVol) / steps;
        let currentStep = 0;

        const fadeTimer = setInterval(() => {
            currentStep++;
            audioElement.volume = Math.max(0, Math.min(1, startVol + volumeStep * currentStep));
            if (currentStep >= steps) clearInterval(fadeTimer);
        }, intervalTime);
    }

    // ==========================================
    // 3. LOGIC CÁC GIAI ĐOẠN 
    // ==========================================
    document.getElementById('btn-timhieu').addEventListener('click', async () => {
        try { await document.documentElement.requestFullscreen(); } catch (e) {}
        
        switchScene('scene-history');
        
        audioHistoryBg.currentTime = 0;
        audioHistoryBg.volume = 0.03;
        audioHistoryBg.play();
        audioH1.play();
        
        let slideIdx = 0;
        const slideImg = document.getElementById('slide-img');
        slideImg.src = CONFIG.images.slidePhotos[0];
        setInterval(() => {
            slideImg.style.opacity = 0;
            setTimeout(() => {
                slideIdx = (slideIdx + 1) % CONFIG.images.slidePhotos.length;
                slideImg.src = CONFIG.images.slidePhotos[slideIdx];
                slideImg.style.opacity = 1;
            }, 800);
        }, 3500);

        const playHistory2 = () => {
            if (historyH2Timer !== null) clearTimeout(historyH2Timer);
            if (audioH2.paused) audioH2.play();
        };
        const scheduleHistory2 = () => {
            const startDelay = Math.max(0, (audioH1.duration - 1) * 1000);
            historyH2Timer = setTimeout(playHistory2, startDelay);
        };

        if (Number.isFinite(audioH1.duration) && audioH1.duration > 0) {
            scheduleHistory2();
        } else {
            audioH1.addEventListener('loadedmetadata', scheduleHistory2, { once: true });
        }
        audioH1.onended = playHistory2;
        
        audioH2.onended = () => {
            document.getElementById('btn-tieptuc').style.display = 'block';
        };

        let isBgFadingIn = false;
        audioH2.ontimeupdate = () => {
            const timeLeft = audioH2.duration - audioH2.currentTime;
            if (audioH2.duration > 0 && timeLeft <= 2 && !isBgFadingIn) {
                isBgFadingIn = true;
                fadeVolume(audioHistoryBg, 0.03, 1, 2000);
            }
        };
    });

    document.getElementById('btn-tieptuc').addEventListener('click', () => {
        audioHistoryBg.pause(); 
        switchScene('scene-error');
        
        setTimeout(() => {
            switchScene('scene-meme');
            startMemeSequence();
        }, 4000);
    });

    function startMemeSequence() {
        const textEl = document.getElementById('troll-text');
        setTimeout(() => {
            textEl.textContent = "Bị lừa rồi nha!!!";
            textEl.style.color = "red";
        }, 2000); 

        setTimeout(() => {
            switchScene('scene-wishes');
            startBirthdaySequence();
        }, 4500); 
    }

    // ==========================================
    // 5. CANVAS CHỐNG ZOOM
    // ==========================================
    const canvas = document.getElementById('wish-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationId;
    let wishInterval;
    let frameCount = 0;
    
    const MAX_FRAME_PARTICLES = 250; 

    function getHeartPoint(t, scale, offsetX, offsetY) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); 
        return { x: offsetX + x * scale, y: offsetY + y * scale };
    }

    class HeartParticle {
        constructor(side, needFrame, startX, startY) {
            this.side = side;
            this.dead = false;
            
            // Kích thước trái tim tự động điều chỉnh theo kích thước màn hình
            let baseSize = Math.min(canvas.width, canvas.height) * 0.03;
            this.size = (Math.random() * 0.5 + 0.8) * baseSize; 
            
            if (needFrame) {
                this.type = Math.random() < 0.8 ? 0 : 1; 
            } else {
                let r = Math.random();
                if (r < 0.35) this.type = 1;
                else if (r < 0.7) this.type = 2;
                else this.type = 3; 
            }

            // Vận tốc gốc tỷ lệ với màn hình
            let speed = (Math.random() * 2 + 1) * (canvas.width / 500); 
            
            this.x = startX;
            this.y = startY;

            if (side === 'left') {
                let angle = -Math.PI / 2 + (Math.random() * Math.PI / 6); 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.t = Math.PI + (Math.random() * Math.PI); 
            } else {
                let angle = -Math.PI / 2 - (Math.random() * Math.PI / 6); 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.t = Math.random() * Math.PI; 
            }
            
            this.wobble = Math.random() * Math.PI * 2;
            this.wobbleSpeed = Math.random() * 0.03 + 0.01;

            if (this.type !== 3) {
                this.phase = 'launch'; 
                this.waitTime = Math.random() * 100 + 100; 
            } else {
                this.phase = 'float'; 
            }
        }

        update() {
            let cx = canvas.width / 2;
            let cy = canvas.height / 2 - 30;
            let scale = Math.min(canvas.width, canvas.height) / 45; 
            
            if (this.type !== 3) {
                let target = getHeartPoint(this.t, scale, cx, cy);
                this.targetX = target.x;
                this.targetY = target.y;
            }

            // Lá chắn từ trường
            let textClearanceRadius = scale * 12;
            let dxC = this.x - cx;
            let dyC = this.y - cy;
            let distToCenter = Math.sqrt(dxC*dxC + dyC*dyC);

            if (distToCenter < textClearanceRadius && this.phase !== 'settled') {
                let repelAngle = Math.atan2(dyC, dxC);
                this.x += Math.cos(repelAngle) * 2;
                this.y += Math.sin(repelAngle) * 2;
                this.vx += Math.cos(repelAngle) * 0.2;
                this.vy += Math.sin(repelAngle) * 0.2;
            }

            // Logic chuyển động
            if (this.phase === 'launch') {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; 
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.5;

                if (this.vy > 0) this.phase = 'travel';
                
            } else if (this.phase === 'travel') {
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist > 5) {
                    this.x += dx * 0.02;
                    this.y += dy * 0.02;
                    this.wobble += this.wobbleSpeed;
                    this.x += Math.sin(this.wobble) * 1;
                } else {
                    this.phase = 'settled'; 
                }
            } else if (this.phase === 'settled') {
                this.wobble += this.wobbleSpeed;
                this.x = this.targetX + Math.sin(this.wobble) * 1.5;
                this.y = this.targetY + Math.cos(this.wobble) * 1.5;

                if (this.type === 1 || this.type === 2) {
                    this.waitTime--;
                    if (this.waitTime <= 0) {
                        this.phase = 'escape';
                        let angleAway = Math.atan2(this.y - cy, this.x - cx);
                        this.vx = Math.cos(angleAway) * (Math.random() * 1 + 0.5);
                        this.vy = Math.sin(angleAway) * (Math.random() * 1 + 0.5);
                        this.vy -= 0.5; 
                    }
                }
            } else if (this.phase === 'escape') {
                this.x += this.vx;
                this.y += this.vy;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1.5;
                if (this.x < -100 || this.x > canvas.width + 100 || this.y < -100 || this.y > canvas.height + 150) this.dead = true;
                
            } else if (this.phase === 'float') {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.02; 
                if (this.vy > 1.5) this.vy = 1.5; 
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 2;
                if (this.y > canvas.height + 150 || this.x < -100 || this.x > canvas.width + 100) this.dead = true;
            }
        }

        draw() {
            ctx.fillStyle = '#e180a3';
            ctx.font = `${this.size}px Arial`;
            ctx.fillText('❤', this.x, this.y);
        }
    }

    function resizeWishCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function animateCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frameCount++;

        let currentFrameParticles = particles.filter(p => p.type === 0).length;

        if (frameCount % 12 === 0) {
            let needFrame = currentFrameParticles < MAX_FRAME_PARTICLES;
            
            // Lấy Tọa độ thực tế theo DOM để chống Zoom
            let leftSticker = document.getElementById('sticker-img-left');
            let rightSticker = document.getElementById('sticker-img-right');
            let rectLeft = leftSticker.getBoundingClientRect();
            let rectRight = rightSticker.getBoundingClientRect();
            
            let startLeftX = rectLeft.right - (rectLeft.width * 0.2);
            let startLeftY = rectLeft.top + (rectLeft.height * 0.2);
            let startRightX = rectRight.left + (rectRight.width * 0.2);
            let startRightY = rectRight.top + (rectRight.height * 0.2);

            particles.push(new HeartParticle('left', needFrame, startLeftX, startLeftY));
            particles.push(new HeartParticle('left', needFrame, startLeftX, startLeftY));
            particles.push(new HeartParticle('right', needFrame, startRightX, startRightY));
            particles.push(new HeartParticle('right', needFrame, startRightX, startRightY));
        }

        particles.forEach(p => { p.update(); p.draw(); });
        particles = particles.filter(p => !p.dead);

        animationId = requestAnimationFrame(animateCanvas);
    }

    function startBirthdaySequence() {
        audioBDay.play();
        resizeWishCanvas();
        
        particles = [];
        frameCount = 0;
        animateCanvas();

        const wishEl = document.getElementById('html-wish-text');
        let wishIndex = 0;
        
        setTimeout(() => {
            wishEl.innerHTML = CONFIG.wishes[wishIndex].replace(/\n/g, '<br>');
            wishEl.style.opacity = 1;
            
            wishInterval = setInterval(() => {
                wishEl.style.opacity = 0; 
                
                setTimeout(() => {
                    wishIndex++;
                    if (wishIndex < CONFIG.wishes.length) {
                        wishEl.innerHTML = CONFIG.wishes[wishIndex].replace(/\n/g, '<br>');
                        wishEl.style.opacity = 1; 
                    } else {
                        clearInterval(wishInterval); 
                        document.getElementById('cake-container').style.display = 'flex'; 
                    }
                }, 800);
            }, 4000); 
        }, 2000);
    }

    window.addEventListener('resize', resizeWishCanvas);

    // ==========================================
    // 6. GIAI ĐOẠN 6: Click Thổi Nến -> Bay nhảy
    // ==========================================
    document.getElementById('btn-thoinen').addEventListener('click', () => {
        audioBDay.pause(); 
        cancelAnimationFrame(animationId); 
        switchScene('scene-party');
        
        let currentPartyTrack = 0;
        audioParty.play();
        audioParty.onended = () => {
            currentPartyTrack = (currentPartyTrack + 1) % CONFIG.audio.partyList.length;
            audioParty.src = CONFIG.audio.partyList[currentPartyTrack];
            audioParty.play();
        };

        const partyScene = document.getElementById('scene-party');
        for (let i = 0; i < 15; i++) {
            let img = document.createElement('img');
            img.src = CONFIG.images.partyGifs[Math.floor(Math.random() * CONFIG.images.partyGifs.length)];
            img.className = 'dancing-meme';
            img.style.top = Math.random() * 80 + 'vh';
            img.style.left = Math.random() * 80 + 'vw';
            partyScene.appendChild(img);
        }
    });

</script>
</body>
</html>
